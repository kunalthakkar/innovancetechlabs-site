<nav class="fixed top-0 w-full z-50 glass border-b border-white/5 transition-all duration-300">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
    <div class="flex items-center justify-between h-20">
      
      <!-- Logo -->
      <div class="flex-shrink-0 flex items-center gap-3 cursor-pointer" routerLink="/">
        <div class="relative w-10 h-10 flex items-center justify-center rounded-lg bg-gradient-to-br from-primary-500 to-primary-800 shadow-[0_0_15px_rgba(59,130,246,0.5)]">
          <lucide-icon [img]="BrainCircuitIcon" class="text-white w-6 h-6"></lucide-icon>
        </div>
        <span class="font-bold text-xl tracking-tight text-white">
          Innovance <span class="text-gradient">TechLabs</span>
        </span>
      </div>

      <!-- Desktop Menu -->
      <div class="hidden md:block">
        <div class="ml-10 flex items-baseline space-x-8">
          <a routerLink="/" routerLinkActive="text-primary-400" [routerLinkActiveOptions]="{exact: true}" class="hover:text-primary-400 text-gray-300 px-3 py-2 rounded-md text-sm font-medium transition-colors">Home</a>
          <a routerLink="/about" routerLinkActive="text-primary-400" class="hover:text-primary-400 text-gray-300 px-3 py-2 rounded-md text-sm font-medium transition-colors">About Us</a>
          <a routerLink="/services" routerLinkActive="text-primary-400" class="hover:text-primary-400 text-gray-300 px-3 py-2 rounded-md text-sm font-medium transition-colors">Services</a>
          <a routerLink="/training" routerLinkActive="text-primary-400" class="hover:text-primary-400 text-gray-300 px-3 py-2 rounded-md text-sm font-medium transition-colors">Training</a>
          <a routerLink="/projects" routerLinkActive="text-primary-400" class="hover:text-primary-400 text-gray-300 px-3 py-2 rounded-md text-sm font-medium transition-colors">Projects</a>
          <a routerLink="/contact" class="btn-primary py-2 px-5 text-sm ml-4 shadow-[0_0_15px_rgba(59,130,246,0.4)]">Contact Us</a>
        </div>
      </div>

      <!-- Mobile menu button -->
      <div class="md:hidden flex items-center">
        <button (click)="toggleMenu()" class="inline-flex items-center justify-center p-2 rounded-md text-gray-400 hover:text-white hover:bg-white/10 focus:outline-none transition-colors">
          <lucide-icon *ngIf="!isMenuOpen" [img]="MenuIcon"></lucide-icon>
          <lucide-icon *ngIf="isMenuOpen" [img]="XIcon"></lucide-icon>
        </button>
      </div>
    </div>
  </div>

  <!-- Mobile Menu -->
  <div *ngIf="isMenuOpen" class="md:hidden glass border-t border-white/5 absolute w-full left-0 animate-in fade-in slide-in-from-top-2">
    <div class="px-2 pt-2 pb-3 space-y-1 sm:px-3 flex flex-col">
      <a routerLink="/" (click)="toggleMenu()" class="hover:bg-white/10 text-white block px-3 py-2 rounded-md text-base font-medium">Home</a>
      <a routerLink="/about" (click)="toggleMenu()" class="hover:bg-white/10 text-gray-300 block px-3 py-2 rounded-md text-base font-medium">About Us</a>
      <a routerLink="/services" (click)="toggleMenu()" class="hover:bg-white/10 text-gray-300 block px-3 py-2 rounded-md text-base font-medium">Services</a>
      <a routerLink="/training" (click)="toggleMenu()" class="hover:bg-white/10 text-gray-300 block px-3 py-2 rounded-md text-base font-medium">Training</a>
      <a routerLink="/projects" (click)="toggleMenu()" class="hover:bg-white/10 text-gray-300 block px-3 py-2 rounded-md text-base font-medium">Projects</a>
      <a routerLink="/contact" (click)="toggleMenu()" class="text-primary-400 hover:text-primary-300 block px-3 py-2 rounded-md text-base font-medium">Contact Us</a>
    </div>
  </div>
</nav>
