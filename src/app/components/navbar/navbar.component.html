<nav class="itl-nav fixed left-0 top-0 z-50 w-full transition-all duration-300" [class.itl-nav-scrolled]="isScrolled">
  <div class="mx-auto max-w-7xl px-4 sm:px-6 lg:px-8">
    <div class="flex h-20 items-center justify-between gap-5">
      <a routerLink="/" class="shrink-0" aria-label="InnovanceTechLabs home" (click)="closeMenu()">
        <app-logo [size]="42" textScale="sm"></app-logo>
      </a>

      <div class="hidden items-center gap-1 md:flex">
        <a
          *ngFor="let link of navLinks"
          [routerLink]="link.path"
          routerLinkActive="is-active"
          [routerLinkActiveOptions]="{ exact: link.exact }"
          class="itl-nav-link"
        >
          {{ link.label }}
        </a>
      </div>

      <div class="hidden items-center gap-3 md:flex">
        <a routerLink="/contact" class="itl-nav-cta">
          Get In Touch
          <lucide-icon [img]="ArrowRightIcon" class="h-4 w-4"></lucide-icon>
        </a>
      </div>

      <button
        type="button"
        (click)="toggleMenu()"
        class="itl-menu-button md:hidden"
        [attr.aria-expanded]="isMenuOpen"
        aria-label="Toggle navigation menu"
      >
        <lucide-icon *ngIf="!isMenuOpen" [img]="MenuIcon" class="h-5 w-5"></lucide-icon>
        <lucide-icon *ngIf="isMenuOpen" [img]="XIcon" class="h-5 w-5"></lucide-icon>
      </button>
    </div>
  </div>

  <div *ngIf="isMenuOpen" class="itl-mobile-menu md:hidden">
    <div class="mx-auto max-w-7xl px-4 pb-5 sm:px-6">
      <div class="grid gap-2">
        <a
          *ngFor="let link of navLinks"
          [routerLink]="link.path"
          (click)="closeMenu()"
          class="itl-mobile-link"
        >
          {{ link.label }}
        </a>
        <a routerLink="/contact" (click)="closeMenu()" class="itl-mobile-link itl-mobile-cta">
          Get In Touch
          <lucide-icon [img]="ArrowRightIcon" class="h-4 w-4"></lucide-icon>
        </a>
      </div>
    </div>
  </div>
</nav>
