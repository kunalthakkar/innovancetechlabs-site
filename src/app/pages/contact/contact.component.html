<!-- Page Header -->
<section class="pt-32 pb-16 relative">
  <div class="absolute inset-0 bg-gradient-to-b from-primary-900/20 to-transparent"></div>
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 relative z-10 text-center" data-aos="fade-up">
    <h1 class="text-4xl md:text-6xl font-bold mb-6">Let's <span class="text-gradient">Connect</span></h1>
    <p class="text-gray-400 max-w-2xl mx-auto text-lg">Have a project in mind or need expert tech consultation? We're here to help you innovate.</p>
  </div>
</section>

<!-- Contact Section -->
<section class="py-16 mb-20">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
    <div class="grid grid-cols-1 lg:grid-cols-2 gap-16">
      
      <!-- Contact Info & Map -->
      <div data-aos="fade-right">
        <h2 class="text-3xl font-bold text-white mb-8">Get in Touch</h2>
        
        <div class="space-y-6 mb-10">
          <div class="flex items-start gap-4">
            <div class="w-12 h-12 rounded-lg bg-primary-500/10 border border-primary-500/30 flex items-center justify-center shrink-0">
              <lucide-icon [img]="MapPinIcon" class="w-6 h-6 text-primary-400"></lucide-icon>
            </div>
            <div>
              <h4 class="text-white font-semibold mb-1">Headquarters</h4>
              <p class="text-gray-400 text-sm">Seventh Bliss, Gota,<br>Ahmedabad - 382481</p>
            </div>
          </div>
          
          <div class="flex items-start gap-4">
            <div class="w-12 h-12 rounded-lg bg-primary-500/10 border border-primary-500/30 flex items-center justify-center shrink-0">
              <lucide-icon [img]="MailIcon" class="w-6 h-6 text-primary-400"></lucide-icon>
            </div>
            <div>
              <h4 class="text-white font-semibold mb-1">Email Us</h4>
              <p class="text-gray-400 text-sm">innovancetechlabs&#64;gmail.com</p>
            </div>
          </div>
          
          <div class="flex items-start gap-4">
            <div class="w-12 h-12 rounded-lg bg-primary-500/10 border border-primary-500/30 flex items-center justify-center shrink-0">
              <lucide-icon [img]="PhoneIcon" class="w-6 h-6 text-primary-400"></lucide-icon>
            </div>
            <div>
              <h4 class="text-white font-semibold mb-1">Call Us</h4>
              <p class="text-gray-400 text-sm">+91 9725287818</p>
            </div>
          </div>
        </div>

        <!-- Placeholder Map -->
        <div class="w-full h-64 rounded-2xl glass border-white/10 overflow-hidden relative group">
          <div class="absolute inset-0 bg-[url('https://www.transparenttextures.com/patterns/cubes.png')] opacity-10"></div>
          <div class="absolute inset-0 flex items-center justify-center bg-dark-950/80">
            <div class="text-center">
              <lucide-icon [img]="MapPinIcon" class="w-10 h-10 text-primary-500 mx-auto mb-2 animate-bounce"></lucide-icon>
              <p class="text-gray-400 text-sm font-medium tracking-widest uppercase">Interactive Map Placeholder</p>
            </div>
          </div>
        </div>
      </div>

      <!-- Contact Form -->
      <div data-aos="fade-left" class="relative">
        <!-- Glow Behind Form -->
        <div class="absolute inset-0 bg-gradient-to-br from-primary-600/20 to-blue-500/20 blur-3xl -z-10 rounded-3xl"></div>
        
        <div class="glass-card !p-8 md:!p-10 border-primary-500/30 relative z-10 h-full">
          <h3 class="text-2xl font-bold text-white mb-6">Send us a Message</h3>
          
          <form class="space-y-6">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
              <div>
                <label for="firstName" class="block text-sm font-medium text-gray-300 mb-2">First Name</label>
                <input type="text" id="firstName" class="w-full bg-dark-900 border border-white/10 rounded-lg px-4 py-3 text-white placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-primary-500/50 focus:border-primary-500 transition-all" placeholder="John">
              </div>
              <div>
                <label for="lastName" class="block text-sm font-medium text-gray-300 mb-2">Last Name</label>
                <input type="text" id="lastName" class="w-full bg-dark-900 border border-white/10 rounded-lg px-4 py-3 text-white placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-primary-500/50 focus:border-primary-500 transition-all" placeholder="Doe">
              </div>
            </div>
            
            <div>
              <label for="email" class="block text-sm font-medium text-gray-300 mb-2">Email Address</label>
              <input type="email" id="email" class="w-full bg-dark-900 border border-white/10 rounded-lg px-4 py-3 text-white placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-primary-500/50 focus:border-primary-500 transition-all" placeholder="john@example.com">
            </div>
            
            <div>
              <label for="service" class="block text-sm font-medium text-gray-300 mb-2">Interested Service</label>
              <select id="service" class="w-full bg-dark-900 border border-white/10 rounded-lg px-4 py-3 text-white focus:outline-none focus:ring-2 focus:ring-primary-500/50 focus:border-primary-500 transition-all appearance-none">
                <option value="" disabled selected>Select a service...</option>
                <option value="web">Web Development</option>
                <option value="mobile">Mobile App Development</option>
                <option value="ai">AI & Analytics</option>
                <option value="cloud">Cloud Solutions</option>
                <option value="training">Training & Certification</option>
              </select>
            </div>
            
            <div>
              <label for="message" class="block text-sm font-medium text-gray-300 mb-2">Your Message</label>
              <textarea id="message" rows="4" class="w-full bg-dark-900 border border-white/10 rounded-lg px-4 py-3 text-white placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-primary-500/50 focus:border-primary-500 transition-all resize-none" placeholder="Tell us about your project..."></textarea>
            </div>
            
            <button type="button" class="btn-primary w-full flex justify-center items-center gap-2 group">
              Send Message
              <lucide-icon [img]="SendIcon" class="w-4 h-4 group-hover:translate-x-1 group-hover:-translate-y-1 transition-transform"></lucide-icon>
            </button>
          </form>
        </div>
      </div>

    </div>
  </div>
</section>
