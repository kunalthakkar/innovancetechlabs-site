<!-- Page Header -->
<section class="pt-32 pb-16 relative">
  <div class="absolute inset-0 bg-gradient-to-b from-primary-900/20 to-transparent"></div>
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 relative z-10 text-center" data-aos="fade-up">
    <h1 class="text-4xl md:text-6xl font-bold mb-6">Our <span class="text-gradient">Services</span></h1>
    <p class="text-gray-400 max-w-2xl mx-auto text-lg">Comprehensive technology solutions designed to solve complex challenges and drive digital transformation.</p>
  </div>
</section>

<!-- Services Grid -->
<section class="py-16 mb-20">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
      <div *ngFor="let service of services; let i = index" class="glass-card group cursor-pointer relative overflow-hidden" [attr.data-aos]="'fade-up'" [attr.data-aos-delay]="i * 100">
        <!-- Hover Glow -->
        <div class="absolute -inset-full group-hover:inset-0 bg-gradient-to-br from-primary-500/10 to-transparent transition-all duration-500 ease-out z-0"></div>
        
        <div class="relative z-10">
          <div class="w-16 h-16 rounded-2xl bg-white/5 border border-white/10 flex items-center justify-center mb-6 text-primary-400 group-hover:text-white group-hover:bg-primary-500 group-hover:shadow-[0_0_20px_rgba(59,130,246,0.6)] transition-all duration-300">
            <lucide-icon [img]="service.icon" class="w-8 h-8"></lucide-icon>
          </div>
          <h3 class="text-2xl font-bold text-white mb-4">{{ service.title }}</h3>
          <p class="text-gray-400 leading-relaxed mb-6">
            {{ service.desc }}
          </p>
          <button class="text-primary-400 text-sm font-medium border-b border-primary-500/30 pb-1 group-hover:border-primary-400 transition-colors">
            Explore Solution &rarr;
          </button>
        </div>
      </div>
    </div>
  </div>
</section>
